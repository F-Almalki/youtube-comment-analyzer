<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تصنيف التعليقات</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a65;
    --line: #dcdad2; --accent: #1f6f5c; --accent-text: #ffffff; --chosen: #e3f1ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161715; --card: #20211e; --text: #ecebe6; --muted: #9c9a92;
      --line: #36372f; --accent: #58b79e; --accent-text: #0e1513; --chosen: #24392f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", Tahoma, system-ui, sans-serif; line-height: 1.7;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .hint { color: var(--muted); font-size: 15px; margin: 0 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px;
  }
  .pick { display: inline-block; cursor: pointer; }
  button, .pick {
    font: inherit; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); padding: 10px 16px; cursor: pointer;
  }
  button:hover, .pick:hover { border-color: var(--accent); }
  button:focus-visible, .pick:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
         color: var(--muted); font-size: 15px; margin-bottom: 8px; flex-wrap: wrap; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
  .bar div { height: 100%; width: 0; background: var(--accent); }
  #comment {
    font-size: 20px; min-height: 130px; max-height: 320px; overflow: auto;
    white-space: pre-wrap; overflow-wrap: anywhere; unicode-bidi: plaintext; text-align: start;
  }
  .labels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
  .labels button { display: flex; align-items: center; gap: 10px; padding: 14px; font-size: 17px; }
  .labels .num {
    width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--line);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 15px; color: var(--muted); flex: none;
  }
  .labels button.chosen { background: var(--chosen); border-color: var(--accent); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .actions .note { color: var(--muted); font-size: 14px; }
  #error { color: #b3261e; margin-top: 12px; }
  [hidden] { display: none !important; }
  @media (max-width: 520px) { .labels { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<main>
  <h1>تصنيف التعليقات</h1>

  <section id="start">
    <p class="hint">اختر ملف <b dir="ltr">sample_300.csv</b> من مجلد المشروع. الملف يبقى على جهازك وما ينرفع لأي مكان.</p>
    <div class="card">
      <label class="pick primary">
        اختر الملف
        <input id="file" type="file" accept=".csv" hidden>
      </label>
      <div id="error" hidden></div>
    </div>
  </section>

  <section id="work" hidden>
    <p class="hint">اضغط رقم من 1 إلى 6 على الكيبورد، أو اضغط الزر. للرجوع اضغط Backspace.</p>
    <div class="top">
      <span id="position"></span>
      <span id="count"></span>
    </div>
    <div class="bar"><div id="progress"></div></div>
    <div class="card"><div id="comment"></div></div>
    <div class="labels" id="labels"></div>
    <div class="actions">
      <button id="back">رجوع</button>
      <button id="save" class="primary">حفظ الملف</button>
      <span class="note">تصنيفاتك تنحفظ تلقائياً في المتصفح، وتقدر تقفل الصفحة وترجع تكمل.</span>
    </div>
  </section>
</main>

<script>
// Label numbers match make_sample.py: the number is what gets saved in my_label.
const LABELS = [
  { n: 1, name: "طلب" },
  { n: 2, name: "مدح" },
  { n: 3, name: "نقد" },
  { n: 4, name: "سؤال" },
  { n: 5, name: "سبام" },
  { n: 6, name: "أخرى" },
];
const STORAGE_KEY = "comment_labels_v1";

let rows = [];   // { id, text, label }
let index = 0;

const $ = (id) => document.getElementById(id);

// ---------- saving progress in the browser ----------
function loadSaved() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveProgress() {
  const saved = {};
  for (const row of rows) if (row.label) saved[row.id] = row.label;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(saved)); } catch (e) {}
}

// ---------- reading and writing CSV ----------
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);   // remove BOM
  const out = [];
  let row = [], field = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false;
      } else field += c;
    } else if (c === '"') quoted = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); field = "";
      out.push(row); row = [];
    } else field += c;
  }
  if (field !== "" || row.length) { row.push(field); out.push(row); }
  return out.filter((r) => r.length > 1 || r[0] !== "");
}
function csvField(value) {
  value = String(value);
  return /[",\n\r]/.test(value) ? '"' + value.replace(/"/g, '""') + '"' : value;
}
function toCSV() {
  const lines = ["comment_id,text,my_label"];
  for (const row of rows) lines.push([row.id, row.text, row.label || ""].map(csvField).join(","));
  return "﻿" + lines.join("\r\n") + "\r\n";
}

// ---------- screen ----------
function buildButtons() {
  for (const label of LABELS) {
    const button = document.createElement("button");
    button.dataset.n = label.n;
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = label.n;
    button.append(num, document.createTextNode(label.name));
    button.addEventListener("click", () => choose(label.n));
    $("labels").append(button);
  }
}
function show() {
  const done = rows.filter((r) => r.label).length;
  $("count").textContent = "صنفت " + done + " من " + rows.length;
  $("progress").style.width = (100 * done / rows.length) + "%";
  if (index >= rows.length) {
    $("position").textContent = "وصلت آخر تعليق";
    $("comment").textContent = "خلصت كل التعليقات. اضغط «حفظ الملف».";
    for (const b of $("labels").children) b.classList.remove("chosen");
    return;
  }
  const row = rows[index];
  $("position").textContent = "التعليق " + (index + 1) + " من " + rows.length;
  $("comment").textContent = row.text;
  $("comment").scrollTop = 0;
  for (const b of $("labels").children) b.classList.toggle("chosen", Number(b.dataset.n) === row.label);
}
function choose(n) {
  if (index >= rows.length) return;
  rows[index].label = n;
  saveProgress();
  index++;
  show();
}
function back() {
  if (index > 0) { index--; show(); }
}
function download() {
  const blob = new Blob([toCSV()], { type: "text/csv;charset=utf-8" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "sample_300_labeled.csv";
  document.body.append(link);
  link.click();
  link.remove();
}

function openFile(text) {
  const table = parseCSV(text);
  const header = (table[0] || []).map((h) => h.trim());
  const idCol = header.indexOf("comment_id");
  const textCol = header.indexOf("text");
  const labelCol = header.indexOf("my_label");
  if (idCol < 0 || textCol < 0) {
    $("error").textContent = "هذا مو الملف الصحيح. اختر sample_300.csv اللي طلعه make_sample.py.";
    $("error").hidden = false;
    return;
  }
  const saved = loadSaved();
  rows = table.slice(1).map((r) => {
    const fromFile = labelCol >= 0 ? Number(r[labelCol]) : 0;
    const label = saved[r[idCol]] || (fromFile >= 1 && fromFile <= 6 ? fromFile : 0);
    return { id: r[idCol], text: r[textCol] || "", label: label };
  });
  const firstEmpty = rows.findIndex((r) => !r.label);
  index = firstEmpty < 0 ? rows.length : firstEmpty;
  $("start").hidden = true;
  $("work").hidden = false;
  show();
}

$("file").addEventListener("change", (event) => {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => openFile(reader.result);
  reader.readAsText(file, "utf-8");
});
$("back").addEventListener("click", back);
$("save").addEventListener("click", download);
document.addEventListener("keydown", (event) => {
  if ($("work").hidden || event.ctrlKey || event.altKey || event.metaKey) return;
  const match = /^(?:Digit|Numpad)([1-6])$/.exec(event.code);
  if (match) { event.preventDefault(); choose(Number(match[1])); }
  else if (event.key === "Backspace") { event.preventDefault(); back(); }
});

buildButtons();
</script>
</body>
</html>
